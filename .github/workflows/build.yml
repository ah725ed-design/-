name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: |
          unzip -o "جرد-الزيوت-والمخازن (2).zip" -d extracted
          ls -la extracted

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verify Project
        working-directory: extracted
        run: |
          ls -la
          if [ ! -f package.json ]; then
            echo "package.json is missing"
            exit 1
          fi

      - name: Install Dependencies
        working-directory: extracted
        run: bun install

      - name: Ensure Capacitor Filesystem Plugin
        working-directory: extracted
        run: |
          if ! grep -q '"@capacitor/filesystem"' package.json; then
            bun add @capacitor/filesystem
          fi

      - name: Build Web Assets
        working-directory: extracted
        run: bun run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Sync Capacitor
        working-directory: extracted
        run: npx cap sync android

      - name: Grant Execute Permission for gradlew
        working-directory: extracted
        run: chmod +x android/gradlew

      - name: Build APK
        working-directory: extracted/android
        run: ./gradlew assembleDebug

      - name: List Extracted Output
        run: ls -R extracted/android/app/build/outputs/apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: extracted/android/app/build/outputs/apk/debug/*.apk
          
